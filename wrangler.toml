name = "una-furniture"
main = "worker/index.js"
compatibility_date = "2026-04-27"
workers_dev = true
routes = [
  { pattern = "unafurniture.com", custom_domain = true },
  { pattern = "www.unafurniture.com", custom_domain = true }
]

[vars]
ADMIN_USERNAME = "admin"

# IMPORTANT: Sensitive secrets must NOT live in [vars] (they are public bundle vars).
# Set them via wrangler secrets:
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put ADMIN_SESSION_SECRET
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "unafurniture"
database_id = "24f83c24-0678-49f6-b7f4-d9487b6cf63c"
migrations_dir = "migrations"

[assets]
directory = "./client"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
