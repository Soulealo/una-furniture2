name = "una-furniture"
main = "worker/index.js"
compatibility_date = "2026-04-27"
workers_dev = true

[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "1234"
ADMIN_SESSION_SECRET = "una-furniture-change-this-session-secret"

[[d1_databases]]
binding = "DB"
database_name = "unafurniture"
database_id = "24f83c24-0678-49f6-b7f4-d9487b6cf63c"
migrations_dir = "migrations"

[assets]
directory = "./client"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
