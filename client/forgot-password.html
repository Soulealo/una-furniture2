<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нууц үг сэргээх - UNA Home & Furniture</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="login-section">
        <div class="login-container">
            <div class="login-form-wrapper">
                <div class="login-form-container">
                    <h2>Нууц үг сэргээх</h2>
                    <p>Бүртгэлтэй имэйл хаягаа оруулна уу.</p>
                    <form id="forgotPasswordForm" class="login-form">
                        <div class="form-group-login">
                            <label for="forgotEmail">И-мэйл хаяг</label>
                            <div class="input-wrapper">
                                <input id="forgotEmail" type="email" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <button class="login-submit-btn" type="submit">Reset link авах</button>
                    </form>
                    <div id="forgotPasswordMessage" class="account-message"></div>
                    <div class="back-to-home"><a href="login.html">Нэвтрэх рүү буцах</a></div>
                </div>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
