<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шинэ нууц үг - UNA Home & Furniture</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="una-design.css">
</head>
<body>
    <section class="login-section">
        <div class="login-container">
            <div class="login-form-wrapper">
                <div class="login-form-container">
                    <h2>Шинэ нууц үг</h2>
                    <p>Шинэ нууц үгээ оруулна уу.</p>
                    <form id="resetPasswordForm" class="login-form">
                        <div class="form-group-login">
                            <label for="resetPassword">Нууц үг</label>
                            <div class="input-wrapper">
                                <input id="resetPassword" type="password" required minlength="6">
                            </div>
                        </div>
                        <div class="form-group-login">
                            <label for="resetConfirmPassword">Нууц үг давтах</label>
                            <div class="input-wrapper">
                                <input id="resetConfirmPassword" type="password" required minlength="6">
                            </div>
                        </div>
                        <button class="login-submit-btn" type="submit">Нууц үг солих</button>
                    </form>
                    <div id="resetPasswordMessage" class="account-message"></div>
                </div>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
